<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amma's Hour: week</title>
<style>
  :root { --ink: #2b2118; --muted: #7a6a5c; --paper: #fff9f0; --line: #eadfce; --bar: #2f7d4f; --miss: #f0d9c4; --flag: #c0392b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--paper); color: var(--ink); }
  .card { padding: 18px 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .big { font-size: 40px; font-weight: 700; color: var(--bar); }
  .sub { color: var(--muted); font-size: 14px; }
  .chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: end; height: 150px; margin: 16px 0 6px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .track { width: 100%; max-width: 34px; height: 110px; background: var(--miss); border-radius: 8px; display: flex; align-items: flex-end; overflow: hidden; }
  .fill { width: 100%; background: var(--bar); border-radius: 8px 8px 0 0; }
  .day { font-size: 12px; color: var(--muted); }
  .flag { font-size: 11px; color: var(--flag); font-weight: 600; min-height: 14px; }
  .missed { margin-top: 10px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div class="card" id="root">Loading…</div>
<script>
  // MCP Apps view (SEP-1865): same handshake as the doses card; renders weekly_summary's structured result.
  let nextId = 1;
  const pending = new Map();
  function rpc(method, params) {
    const id = nextId++;
    window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    return new Promise((resolve) => pending.set(id, resolve));
  }
  function notify(method, params) { window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*"); }
  function escape(text) { return String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  const WEEKDAY = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  function render(data) {
    const days = data.days || [];
    const missedNames = [...new Set((data.missed || []).map((m) => m.medicine))].slice(0, 3);
    document.getElementById("root").innerHTML = `
      <h1>${escape(data.parent || "Amma")}'s week</h1>
      <div class="big">${data.percent ?? 0}%</div>
      <div class="sub">${data.taken ?? 0} of ${data.expected ?? 0} doses taken in the last 7 days</div>
      <div class="chart">${days.map((d) => {
        const pct = d.expected ? Math.round((d.taken / d.expected) * 100) : 0;
        const weekday = WEEKDAY[new Date(d.date + "T12:00:00Z").getUTCDay()];
        return `<div class="col"><div class="flag">${d.redFlags.length ? "⚠ " + escape(d.redFlags[0]) : ""}</div>
          <div class="track" title="${d.taken}/${d.expected}"><div class="fill" style="height:${pct}%"></div></div>
          <div class="day">${weekday}</div></div>`;
      }).join("")}</div>
      ${missedNames.length ? `<div class="missed">Most missed: ${missedNames.map(escape).join(", ")}</div>` : ""}`;
    notify("ui/notifications/size-changed", { height: document.documentElement.scrollHeight });
  }

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id)) { pending.get(msg.id)(msg.result); pending.delete(msg.id); return; }
    if (msg.method === "ui/notifications/tool-result" && msg.params) render(msg.params.structuredContent || {});
  });
  rpc("ui/initialize", { appInfo: { name: "ammas-hour-week", version: "0.1.0" }, appCapabilities: {}, protocolVersion: "2026-01-26" })
    .then(() => notify("ui/notifications/initialized", {}));
</script>
</body>
</html>
