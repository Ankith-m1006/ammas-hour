<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amma's Hour: doses</title>
<style>
  :root { --ink: #2b2118; --muted: #7a6a5c; --paper: #fff9f0; --line: #eadfce; --ok: #2f7d4f; --due: #b4541a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--paper); color: var(--ink); }
  .card { padding: 18px 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li { display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .pill { width: 44px; height: 26px; border-radius: 13px; border: 1px solid rgba(0,0,0,.12); }
  .name { font-size: 18px; font-weight: 600; }
  .how { color: var(--muted); font-size: 14px; }
  .state { font-size: 15px; font-weight: 600; color: var(--due); white-space: nowrap; }
  .state.taken { color: var(--ok); }
  .empty { color: var(--muted); font-size: 16px; padding: 10px 0; }
  .large .name { font-size: 24px; } .large .how { font-size: 18px; } .large h1 { font-size: 28px; }
</style>
</head>
<body>
<div class="card" id="root"><div class="empty">Loading…</div></div>
<script>
  // MCP Apps view (SEP-1865): handshake with the host, then render the tool result it forwards.
  const PILL_COLOURS = { white: "#fbfbf8", orange: "#f39a3d", pink: "#f4a7c0", yellow: "#f3d34a", blue: "#7fb2e5", red: "#e0675b" };
  let nextId = 1;
  const pending = new Map();

  function rpc(method, params) {
    const id = nextId++;
    window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    return new Promise((resolve) => pending.set(id, resolve));
  }
  function notify(method, params) { window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*"); }
  function colourOf(looks) {
    const hit = Object.keys(PILL_COLOURS).find((c) => looks.toLowerCase().includes(c));
    return PILL_COLOURS[hit || "white"];
  }
  function escape(text) { return String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function render(data) {
    const root = document.getElementById("root");
    const slot = data.slot ? data.slot[0].toUpperCase() + data.slot.slice(1) : "Now";
    if (!data.doses || data.doses.length === 0) {
      root.innerHTML = `<h1>${slot} medicines</h1><div class="empty">Nothing to take now.</div>`;
    } else {
      const left = data.doses.filter((d) => !d.taken).length;
      root.innerHTML = `<h1>${slot} medicines</h1>
        <div class="sub">${left === 0 ? "All taken today" : `${left} to take`}</div>
        <ul>${data.doses.map((d) => `<li>
          <div class="pill" style="background:${colourOf(d.looks)}"></div>
          <div><div class="name">${escape(d.name)}</div><div class="how">${escape(d.looks)} · ${escape(d.dose)} · ${escape(d.instructions)}</div></div>
          <div class="state ${d.taken ? "taken" : ""}">${d.taken ? `✓ ${escape(d.takenAt || "Taken")}` : "To take"}</div>
        </li>`).join("")}</ul>`;
    }
    notify("ui/notifications/size-changed", { height: document.documentElement.scrollHeight });
  }

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id)) {
      pending.get(msg.id)(msg.result);
      pending.delete(msg.id);
      return;
    }
    if (msg.method === "ui/notifications/tool-result" && msg.params) {
      render(msg.params.structuredContent || {});
    }
    if (msg.method === "ui/notifications/host-context-changed" && msg.params) {
      document.body.classList.toggle("large", msg.params.displayMode === "fullscreen");
    }
  });

  rpc("ui/initialize", { appInfo: { name: "ammas-hour-doses", version: "0.1.0" }, appCapabilities: {}, protocolVersion: "2026-01-26" })
    .then((result) => {
      document.body.classList.toggle("large", result && result.hostContext && result.hostContext.displayMode === "fullscreen");
      notify("ui/notifications/initialized", {});
    });
</script>
</body>
</html>
